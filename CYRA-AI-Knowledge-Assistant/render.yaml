services:
  - type: web
    name: aicte-cyra-rag-service
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python -m backend.ingestion.run
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FAST_EMBEDDING
        value: "true"
      - key: FAST_LLM
        value: "true"
      - key: PROJECT_SCOPE
        value: aicte
      - key: GOOGLE_API_KEY
        sync: false
